name: vitrina
on:
  push:
    paths: ['.github/workflows/vitrina.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p vitrina
          B=https://d3b5d40e-0a88-43a7-b628-ff9525a63cb4.frame.claudeusercontent.com/_f/1795550059-2a07/vitrina
          for f in ikonka-512.png telefon-01-home.jpg telefon-02-cards.jpg telefon-03-game.jpg telefon-04-read.jpg telefon-05-tales.jpg telefon-06-par.jpg tv-01-home.jpg tv-02-cards.jpg tv-03-game.jpg tv-04-read.jpg tv-05-tales.jpg tv-06-par.jpg; do
            curl -fsSL -o "vitrina/$f" "$B/$f"
          done
          ls -la vitrina
          sha256sum vitrina/*
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vitrina
          git commit -m "Витрина RuStore: снимки и иконка" || echo nothing
          git push
