name: vitrina
on:
  push:
    paths: ['.github/workflows/vitrina.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          B=https://d3b5d40e-0a88-43a7-b628-ff9525a63cb4.frame.claudeusercontent.com/_f/1795588838-212b
          rm -rf vitrina && mkdir -p vitrina
          for f in ikonka-512.png telefon-01-home.jpg telefon-02-look.jpg telefon-03-games.jpg telefon-04-move.jpg telefon-05-bed.jpg telefon-06-cards.jpg telefon-07-par.jpg tv-01-home.jpg tv-02-look.jpg tv-03-games.jpg tv-04-move.jpg tv-05-bed.jpg tv-06-cards.jpg tv-07-par.jpg; do
            curl -fsSL -o "vitrina/$f" "$B/vitrina2/$f"
          done
          for f in terms.html privacy.html; do
            curl -fsSL -o "$f" "$B/sayt2/$f"
          done
          ls -la vitrina
          sha256sum vitrina/* terms.html privacy.html
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A vitrina terms.html privacy.html
          git commit -m "Витрина 2 и оферта: основная версия, комплекты" || echo nothing
          git push
